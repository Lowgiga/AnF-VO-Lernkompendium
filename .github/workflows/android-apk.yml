name: Android APK

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "android/**"
      - "index.html"
      - "algorithm/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "algorithm/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          find android/app/build/outputs/apk/debug -name "*.apk" -print0 | while IFS= read -r -d "" apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anfoevo-android-v2.8.0-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
