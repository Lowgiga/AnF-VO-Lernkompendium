# GitHub Copilot Coding Agent environment setup.
# Keep this setup aligned with .github/workflows/android-build.yml.

name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install browser test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Verify repository baseline
        run: python tests/verify-build.py
