name: Android debug build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'algorithm/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'algorithm/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APKs
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mapfile -d '' apks < <(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print0)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo 'No debug APKs were produced.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: AnFoeVO-v2.9.1-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
