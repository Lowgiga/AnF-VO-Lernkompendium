name: Project validation and Android debug build

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "android/**"
      - "index.html"
      - "algorithm/**"
      - "docs/ARCHITECTURE.md"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "PROJECT_MANIFEST.json"
      - "manifest.json"
      - "sw.js"
      - ".nojekyll"
      - "icon-*.png"
      - "bg/**"
      - "scripts/**"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "algorithm/**"
      - "docs/ARCHITECTURE.md"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "PROJECT_MANIFEST.json"
      - "manifest.json"
      - "sw.js"
      - ".nojekyll"
      - "icon-*.png"
      - "bg/**"
      - "scripts/**"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate web app and build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Verify Android WebView asset parity
        shell: bash
        run: |
          set -euo pipefail
          source_html="index.html"
          android_html="android/app/src/main/assets/index.html"
          test -f "$source_html"
          test -f "$android_html"
          if ! cmp -s "$source_html" "$android_html"; then
            echo "Root index.html and Android WebView asset differ." >&2
            diff -u "$source_html" "$android_html" | head -n 120 || true
            exit 1
          fi
          echo "Root HTML and Android WebView asset are byte-identical."

      - name: Verify root and Android PWA asset parity
        shell: bash
        run: |
          set -euo pipefail
          files=(manifest.json sw.js icon-192.png icon-512.png icon-512-maskable.png)
          for file in "${files[@]}"; do
            test -f "$file"
            test -f "android/app/src/main/assets/$file"
            if ! cmp -s "$file" "android/app/src/main/assets/$file"; then
              echo "PWA asset differs: $file" >&2
              exit 1
            fi
          done
          while IFS= read -r -d '' frame; do
            relative="${frame#android/app/src/main/assets/}"
            test -f "$relative"
            if ! cmp -s "$relative" "$frame"; then
              echo "Background frame differs: $relative" >&2
              exit 1
            fi
          done < <(find android/app/src/main/assets/bg -type f -name '*.webp' -print0)
          test -f .nojekyll
          test -f manifest.json
          python - << 'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          html = Path("index.html").read_text(encoding="utf-8")
          assert manifest["start_url"] == "./" and manifest["scope"] == "./"
          assert '<link rel="manifest" href="./manifest.json">' in html
          assert "register('./sw.js')" in html
          assert "android_asset" in html
          print("Root and Android PWA assets match.")
          PY

      - name: Run static build verification
        run: python tests/verify-build.py

      - name: Test static build verification
        run: python -m unittest discover -s tests -p 'test_verify_build.py'

      - name: Run browser tests
        working-directory: tests
        run: npm run test:all

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APKs
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          apk_count="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "No debug APKs were produced." >&2
            exit 1
          fi
          while IFS= read -r -d '' apk; do
            "$apksigner" verify --verbose "$apk"
          done < <(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print0)

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: AnFoeVO-v2.9.4-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
