name: Project validation and Android debug build

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "android/**"
      - "index.html"
      - "algorithm/**"
      - "docs/ARCHITECTURE.md"
      - "tests/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "algorithm/**"
      - "docs/ARCHITECTURE.md"
      - "tests/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate web app and build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run static build verification
        run: python tests/verify-build.py

      - name: Test static build verification
        run: python -m unittest discover -s tests -p 'test_verify_build.py'

      - name: Run browser tests
        working-directory: tests
        run: npm run test:all

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APKs
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          apk_count="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "No debug APKs were produced." >&2
            exit 1
          fi
          while IFS= read -r -d '' apk; do
            "$apksigner" verify --verbose "$apk"
          done < <(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print0)

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: AnFoeVO-v2.9.1-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
